name: Release

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0'

jobs:
  ci:
    name: CI 检查
    uses: ./.github/workflows/ci.yml

  release:
    name: Release 发布
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 解析版本
        id: version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: 获取包名
        id: package
        run: |
          if (Test-Path "legion.von") {
            $content = Get-Content legion.von -Raw | ConvertFrom-Json
            $name = $content.name
          } else {
            $name = "${{ github.repository_owner }}.${{ github.event.repository.name }}"
          }
          Write-Output "name=$name" >> $env:GITHUB_OUTPUT

      - name: 构建
        run: dotnet build --configuration Release

      - name: 运行测试
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: 打包
        run: dotnet pack --no-build --configuration Release --output ./dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body: |
            ## 安装

            ```bash
            legion install ${{ steps.package.outputs.name }}@${{ steps.version.outputs.version }}
            ```

            ## 变更

            请查看提交历史获取详细变更信息。
          files: |
            ./dist/*.nupkg
            ./dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Valhalla
        env:
          VALHALLA_TOKEN: ${{ secrets.VALHALLA_TOKEN }}
          VALHALLA_REGISTRY: ${{ vars.VALHALLA_REGISTRY_URL || 'https://valhalla.valkyrie-lang.dev' }}
        run: |
          dotnet run --project projects/Valkyrie.ToolChains/Valkyrie.ToolChains.csproj publish \
            --package-name "${{ steps.package.outputs.name }}" \
            --version "${{ steps.version.outputs.version }}" \
            --registry "${{ env.VALHALLA_REGISTRY }}" \
            --token "${{ env.VALHALLA_TOKEN }}"

      - name: 生成证明
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: "${{ github.repository_owner }}/${{ github.event.repository.name }}"
          subject-version: "${{ steps.version.outputs.version }}"
          subject-digest: sha256:${{ hashFiles('./dist/*.nupkg') }}
