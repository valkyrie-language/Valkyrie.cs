name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'documentation/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'documentation/**'

env:
  DOTNET_VERSION: '11.0'

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 恢复依赖
        run: dotnet restore

      - name: 构建
        run: dotnet build --no-restore --configuration Release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
          retention-days: 7

  test:
    name: 测试
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./build

      - name: 运行单元测试
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml
          retention-days: 14

  format:
    name: 代码格式检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 检查代码格式
        run: dotnet format --verify-no-changes --verbosity diagnostic

  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 运行代码分析
        run: dotnet build --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true /warnaserror

  benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 运行基准测试
        run: dotnet run --project projects/Valkyrie.ToolChains/Valkyrie.ToolChains.csproj benchmark --output ./benchmark-results

      - name: 上传基准结果
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./benchmark-results/**
          retention-days: 30

  security:
    name: 安全审计
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 审计依赖
        run: dotnet list package --vulnerable

      - name: 初始化 SARIF 扫描
        run: |
          dotnet tool install --global WhitespaceSaaSScanner || true

  publish-artifacts:
    name: 发布预览产物
    runs-on: ubuntu-latest
    needs: [build, test, format, lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./build

      - name: 创建预览包
        run: |
          dotnet pack --no-build --configuration Release --output ./artifacts

      - name: 上传预览包
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages
          path: ./artifacts/**/*.nupkg
          retention-days: 5

  summary:
    name: 构建总结
    runs-on: ubuntu-latest
    needs: [build, test, format, lint]
    if: always()

    steps:
      - name: 打印构建结果
        run: |
          echo "## 构建结果总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ needs.format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
